[project]
site_name = "CryoSpawn Docs"
site_description = "Architecture, setup, web console, God-Mode admin, and API documentation for CryoSpawn."
site_url = "https://nirjhardebnath.github.io/CryoSpawn/docs/"
repo_url = "https://github.com/NirjharDebnath/CryoSpawn"
docs_dir = "docs"
site_dir = "_zensical_site"

nav = [
  { "Home" = "index.md" },
  { "Interactive Flow Map ↗" = "../" },
  { "Setup & Quick Start" = "SETUP.md" },
  { "Architecture & Design" = "DESIGN.md" },
  { "Web Console (xterm.js)" = "CONSOLE.md" },
  { "God-Mode Admin & RootFS" = "ADMIN.md" },
  { "Cloudflare & Nginx Ingress" = "DNS.md" },
  { "HTTP API Reference" = "API.md" },
  { "Known Issues & Status" = "KNOWN-ISSUES.md" },
  { "Roadmap" = "ROADMAP.md" }
]

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy"
]
