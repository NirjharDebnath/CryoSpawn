<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoSpawn - Alpine Daylight Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="alpine-daylight font-sans antialiased flex items-center justify-center min-h-screen p-4 overflow-x-hidden">
    <!-- Alpine Daylight Horizon & Cold Wind/Snow Atmosphere -->
    <div class="alpine-horizon" aria-hidden="true"></div>
    <div class="alpine-weather-layer" aria-hidden="true">
        <span class="wind-streak wind-streak--1"></span>
        <span class="wind-streak wind-streak--2"></span>
        <span class="wind-streak wind-streak--3"></span>
        <span class="wind-streak wind-streak--4"></span>
        <span class="wind-streak wind-streak--5"></span>
        <span class="wind-streak wind-streak--6"></span>
        <span class="snow-mote snow-mote--1"></span>
        <span class="snow-mote snow-mote--2"></span>
        <span class="snow-mote snow-mote--3"></span>
        <span class="snow-mote snow-mote--4"></span>
        <span class="snow-mote snow-mote--5"></span>
        <span class="snow-mote snow-mote--6"></span>
        <span class="snow-mote snow-mote--7"></span>
        <span class="snow-mote snow-mote--8"></span>
        <span class="snow-mote snow-mote--9"></span>
        <span class="snow-mote snow-mote--10"></span>
        <span class="snow-mote snow-mote--11"></span>
        <span class="snow-mote snow-mote--12"></span>
    </div>

    <div class="alpine-shell alpine-card p-8 rounded-2xl w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-sky-100/90 border border-sky-200/80 flex items-center justify-center shadow-sm mb-3 text-[#0b4f7c]">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07M9 4l3 3 3-3M9 20l3-3 3 3M4 9l3 3-3 3M20 9l-3 3 3 3"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-[#0c2238] text-center">CryoSpawn Cloud</h1>
            <p class="text-xs font-medium text-[#486581] mt-1 text-center">Firecracker MicroVM Hypervisor Platform</p>
        </div>

        <div class="flex border-b border-sky-200/80 mb-6">
            <button id="tab-login" type="button" class="flex-1 pb-2.5 text-sm font-semibold text-[#0b4f7c] border-b-2 border-[#0b4f7c] transition-colors">Login</button>
            <button id="tab-register" type="button" class="flex-1 pb-2.5 text-sm font-medium text-[#486581] hover:text-[#0c2238] transition-colors">Register</button>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-[#1e3a52] mb-1.5">Username</label>
                <input type="text" id="username" required autocomplete="username" class="alpine-input w-full rounded-lg px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold text-[#1e3a52] mb-1.5">Password</label>
                <input type="password" id="password" required minlength="6" autocomplete="current-password" class="alpine-input w-full rounded-lg px-3.5 py-2.5 text-sm">
            </div>
            <button type="submit" id="submit-btn" class="alpine-btn-primary w-full font-semibold py-2.5 px-4 rounded-lg text-sm">
                Sign In
            </button>
            <p id="msg" class="text-sm mt-2 hidden text-center font-medium"></p>
        </form>
    </div>

    <script>
        let isRegister = false;
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        const msg = document.getElementById('msg');

        tabLogin.addEventListener('click', () => {
            isRegister = false;
            tabLogin.className = "flex-1 pb-2.5 text-sm font-semibold text-[#0b4f7c] border-b-2 border-[#0b4f7c] transition-colors";
            tabRegister.className = "flex-1 pb-2.5 text-sm font-medium text-[#486581] hover:text-[#0c2238] transition-colors";
            submitBtn.textContent = "Sign In";
            msg.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            isRegister = true;
            tabRegister.className = "flex-1 pb-2.5 text-sm font-semibold text-[#0b4f7c] border-b-2 border-[#0b4f7c] transition-colors";
            tabLogin.className = "flex-1 pb-2.5 text-sm font-medium text-[#486581] hover:text-[#0c2238] transition-colors";
            submitBtn.textContent = "Create Account";
            msg.classList.add('hidden');
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    msg.textContent = data.error || (isRegister ? 'Registration failed' : 'Login failed');
                    msg.className = "text-rose-600 text-sm mt-2 text-center font-medium";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.textContent = 'Network error: ' + err.message;
                msg.className = "text-rose-600 text-sm mt-2 text-center font-medium";
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
