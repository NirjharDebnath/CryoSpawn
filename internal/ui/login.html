<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoSpawn - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">CryoSpawn Cloud</h1>
        <p class="text-xs text-slate-500 mb-6 text-center">Firecracker MicroVM Hypervisor Platform</p>
        
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-login" class="flex-1 pb-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600">Login</button>
            <button id="tab-register" class="flex-1 pb-2 text-sm font-medium text-slate-500 hover:text-slate-800">Register</button>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
                <input type="text" id="username" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white font-medium py-2 px-4 rounded-md hover:bg-slate-800 transition-colors text-sm">
                Sign In
            </button>
            <p id="msg" class="text-sm mt-2 hidden text-center"></p>
        </form>
    </div>

    <script>
        let isRegister = false;
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        const msg = document.getElementById('msg');

        tabLogin.addEventListener('click', () => {
            isRegister = false;
            tabLogin.className = "flex-1 pb-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600";
            tabRegister.className = "flex-1 pb-2 text-sm font-medium text-slate-500 hover:text-slate-800";
            submitBtn.textContent = "Sign In";
            msg.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            isRegister = true;
            tabRegister.className = "flex-1 pb-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600";
            tabLogin.className = "flex-1 pb-2 text-sm font-medium text-slate-500 hover:text-slate-800";
            submitBtn.textContent = "Create Account";
            msg.classList.add('hidden');
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    msg.textContent = data.error || (isRegister ? 'Registration failed' : 'Login failed');
                    msg.className = "text-red-500 text-sm mt-2 text-center";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.textContent = 'Network error: ' + err.message;
                msg.className = "text-red-500 text-sm mt-2 text-center";
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
