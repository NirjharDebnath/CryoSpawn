<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoSpawn - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold tracking-tight">CryoSpawn</h1>
            <p class="text-xs text-slate-400 mt-1" id="user-greeting">Loading...</p>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/dashboard" class="text-slate-400 hover:bg-slate-800 hover:text-white flex items-center px-4 py-2.5 rounded-lg transition-colors font-medium text-sm">💻 MicroVMs</a>
            <a href="/volumes" class="text-slate-400 hover:bg-slate-800 hover:text-white flex items-center px-4 py-2.5 rounded-lg transition-colors font-medium text-sm">💾 Elastic Volumes</a>
            <a href="/networks" class="text-slate-400 hover:bg-slate-800 hover:text-white flex items-center px-4 py-2.5 rounded-lg transition-colors font-medium text-sm">🌐 Routing & Mesh</a>
            <a href="/settings" class="bg-blue-600 text-white shadow-sm flex items-center px-4 py-2.5 rounded-lg transition-colors font-medium text-sm">⚙️ Settings</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-2 bg-slate-800 hover:bg-red-600 rounded-lg transition-colors text-sm font-medium">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between md:hidden">
            <h1 class="text-lg font-bold">CryoSpawn</h1>
            <button onclick="logout()" class="text-sm font-medium text-red-600">Logout</button>
        </header>
        
        <div class="p-8 max-w-6xl mx-auto w-full">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Account Settings</h2>
                <p class="text-slate-500 text-sm mt-1">Manage your API keys and profile.</p>
            </div>
            
            
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <h3 class="text-lg font-semibold text-slate-800 mb-2">Account Security</h3>
    <p class="text-sm text-slate-600 mb-6">Update your password to keep your CryoSpawn account secure.</p>
    
    <form id="change-pwd-form" class="space-y-4 max-w-md">
        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Current Password</label>
            <input type="password" id="current-password" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">New Password (min 6 chars)</label>
            <input type="password" id="new-password" required minlength="6" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Confirm New Password</label>
            <input type="password" id="confirm-password" required minlength="6" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" id="pwd-btn" class="bg-slate-900 text-white px-4 py-2 rounded-md text-sm hover:bg-slate-800 transition-colors">Update Password</button>
        <p id="pwd-msg" class="text-sm mt-2 hidden"></p>
    </form>
</div>

<script>
    document.getElementById('change-pwd-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const current_password = document.getElementById('current-password').value;
        const new_password = document.getElementById('new-password').value;
        const confirm_password = document.getElementById('confirm-password').value;
        const msg = document.getElementById('pwd-msg');
        msg.classList.add('hidden');

        if (new_password !== confirm_password) {
            msg.textContent = "New passwords do not match.";
            msg.className = "text-sm text-red-600 mt-2";
            msg.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ current_password, new_password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.textContent = data.message || "Password updated successfully.";
                msg.className = "text-sm text-green-600 mt-2";
                msg.classList.remove('hidden');
                document.getElementById('change-pwd-form').reset();
            } else {
                msg.textContent = data.error || "Failed to update password.";
                msg.className = "text-sm text-red-600 mt-2";
                msg.classList.remove('hidden');
            }
        } catch (err) {
            msg.textContent = "Network error: " + err.message;
            msg.className = "text-sm text-red-600 mt-2";
            msg.classList.remove('hidden');
        }
    });
</script>

        </div>
    </main>

    <script>
        async function fetchUser() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) { window.location.href = '/login'; return; }
                const data = await res.json();
                document.getElementById('user-greeting').innerText = `Welcome, ${data.username}`;
            } catch (e) {
                window.location.href = '/login';
            }
        }
        fetchUser();

        async function logout() {
            await fetch('/api/auth/logout', {method:'POST'});
            window.location.href = '/login';
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
